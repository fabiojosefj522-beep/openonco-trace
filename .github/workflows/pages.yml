# Publica a landing page (raiz) e a demo (/demo/) no GitHub Pages a cada push na main.
# Pré-requisito único: Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Monta o site
        run: |
          node scripts/build-standalone.js
          # Raiz: landing page. /demo/: a demo com todos os caminhos relativos intactos.
          mkdir -p _site/demo
          cp site/index.html _site/index.html
          cp -r index.html packages mock demo openapi dist _site/demo/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
